<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>胡嘉倩 Olivia Hu | 急診室專科護理師</title>
  <meta name="description" content="胡嘉倩 Olivia Hu - 汐止國泰綜合醫院急診室專科護理師 個人電子名片" />
  <style>
    :root {
      /* 海水藍與純白主視覺變數 */
      --ocean-primary: #0077B6;
      --ocean-dark: #023E8A;
      --ocean-light: #F0F8FF;
      --ocean-accent: #0096C7;
      --ocean-border: #D0E8F2;
      --bg-page: #F4F9FC;
      --bg-card: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #52667A;
      --shadow-card: 0 10px 30px rgba(2, 62, 138, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      padding: 16px 14px 40px;
      display: flex;
      justify-content: center;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 頂部個人名片主卡 */
    .profile-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--ocean-border);
    }

    .profile-banner {
      height: 104px;
      background: linear-gradient(135deg, var(--ocean-dark) 0%, var(--ocean-primary) 55%, var(--ocean-accent) 100%);
      position: relative;
    }

    .profile-banner::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      background: var(--bg-card);
      border-radius: 24px 24px 0 0;
    }

    .profile-header {
      padding: 0 22px 24px;
      text-align: center;
      margin-top: -48px;
      position: relative;
      z-index: 2;
    }

    .avatar-circle {
      width: 88px;
      height: 88px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FFFFFF, var(--ocean-light));
      border: 4px solid #FFFFFF;
      box-shadow: 0 6px 16px rgba(0, 119, 182, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ocean-primary);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .name-zh {
      font-size: 24px;
      font-weight: 700;
      color: var(--ocean-dark);
      letter-spacing: 0.5px;
    }

    .name-en {
      font-size: 15px;
      font-weight: 500;
      color: var(--ocean-accent);
      margin-top: 2px;
      letter-spacing: 0.8px;
    }

    .role-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      background-color: var(--ocean-light);
      color: var(--ocean-primary);
      border: 1px solid var(--ocean-border);
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
    }

    /* 姓名下方三個主要功能按鈕 */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px 8px;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn svg {
      width: 22px;
      height: 22px;
    }

    .btn-call {
      background-color: var(--ocean-light);
      color: var(--ocean-dark);
      border: 1px solid var(--ocean-border);
    }

    .btn-email {
      background-color: var(--ocean-light);
      color: var(--ocean-primary);
      border: 1px solid var(--ocean-border);
    }

    .btn-vcard {
      background: linear-gradient(135deg, var(--ocean-primary), var(--ocean-dark));
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0, 119, 182, 0.25);
    }

    /* 內容資訊區塊通用樣式 */
    .section-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--ocean-border);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ocean-dark);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--ocean-light);
    }

    .section-title svg {
      width: 19px;
      height: 19px;
      color: var(--ocean-primary);
      flex-shrink: 0;
    }

    /* 區塊一：臨床專長領域 */
    .specialty-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
